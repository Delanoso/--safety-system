name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Redeploy only (skip Docker build, ~2 min)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  APP_DIR: /opt/safety_system_v2

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_build != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name (lowercase required by Docker)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_BASE_URL=https://onlinesafetysolutions.co.za
            SITE_URL=https://onlinesafetysolutions.co.za
            CACHE_BUST=${{ github.sha }}

  deploy:
    needs: build
    if: ${{ always() && !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name (lowercase required by Docker)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Prepare VPS directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: mkdir -p ${{ env.APP_DIR }}/scripts

      - name: Pack deploy files
        run: |
          mkdir -p .deploy/scripts
          cp docker-compose.prod.yml .deploy/
          cp scripts/vps-deploy.sh .deploy/scripts/
          chmod +x .deploy/scripts/vps-deploy.sh
          tar -czf deploy-bundle.tar.gz -C .deploy .

      - name: Upload deploy bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: deploy-bundle.tar.gz
          target: ${{ env.APP_DIR }}

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script_stop: true
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN,APP_DIR
          script: |
            set -e
            mkdir -p "$APP_DIR/scripts"
            tar -xzf "$APP_DIR/deploy-bundle.tar.gz" -C "$APP_DIR"
            chmod +x "$APP_DIR/scripts/vps-deploy.sh"
            bash "$APP_DIR/scripts/vps-deploy.sh"
